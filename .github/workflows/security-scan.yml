name: SentinelCI Security Scan

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 fetches full git history — required because get_changed_files() diffs against a base commit that a shallow clone wouldn't contain
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # GITHUB_EVENT_PATH and GITHUB_SHA do NOT need to be set here — the Actions runner provides them automatically as default env vars, which is exactly why main.py's Option 1 design (read env vars unconditionally, no local/CI branching) works without modification in real CI.
      - name: Run SentinelCI Security Scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m app.main
